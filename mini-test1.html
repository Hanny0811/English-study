<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --paper: #F2ECDD;
    --kraft: #D9C7A0;
    --kraft-dark: #C7B285;
    --ink: #1E3348;
    --rope: #8B6F47;
    --stamp-red: #B23A2E;
    --stamp-green: #3F6E4E;
    --white: #FBF8F1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(30,51,72,0.06) 1px, transparent 0);
    background-size:22px 22px;
    font-family:'Libre Franklin', sans-serif;color:var(--ink);
    min-height:100vh;padding:28px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{text-align:center;margin-bottom:16px;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--rope);text-transform:uppercase;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:26px;margin:4px 0 2px;}
  .sub{font-size:13px;color:#5a5044;}

  .lesson-nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px;}
  .navchip{font-family:'Space Mono',monospace;font-size:11px;background:var(--white);border:1px solid var(--kraft-dark);border-radius:20px;padding:5px 10px;text-decoration:none;color:var(--ink);}
  .navchip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  .part-tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px;}
  .parttag{font-family:'Space Mono',monospace;font-size:10.5px;background:var(--white);border:1px solid var(--kraft-dark);border-radius:20px;padding:4px 10px;color:#8a7f6c;}
  .parttag.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .parttag.done{border-color:var(--stamp-green);color:var(--stamp-green);}

  .progress-wrap{max-width:420px;margin:0 auto 6px;}
  .progress-track{height:6px;background:var(--kraft-dark);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--ink);width:0%;transition:width .3s;}
  .progress-label{text-align:center;font-family:'Space Mono',monospace;font-size:11px;color:var(--rope);margin:8px 0 20px;}

  .qcard{
    max-width:420px;margin:0 auto 18px;background:var(--kraft);
    border:1px solid rgba(30,51,72,0.25);border-radius:8px;
    box-shadow:0 10px 24px rgba(30,51,72,0.15);
    padding:26px 22px;position:relative;
  }
  .qcard::before{
    content:"";position:absolute;top:14px;left:14px;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #f4f0e4, #b9ac86 60%, #8a7b53);
    box-shadow:inset 0 0 0 2px rgba(30,51,72,0.35), 0 1px 2px rgba(0,0,0,0.3);
  }
  .qnum{font-family:'Space Mono',monospace;font-size:11px;color:var(--rope);text-align:right;letter-spacing:1px;}
  .qtype{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--rope);text-transform:uppercase;letter-spacing:1.5px;text-align:center;margin-bottom:8px;}
  .qword{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(22px,6vw,30px);text-align:center;margin:10px 0 4px;}
  .qpos{font-family:'Space Mono',monospace;font-size:11px;color:var(--rope);text-transform:uppercase;text-align:center;letter-spacing:1.5px;margin-bottom:14px;}
  .qhint{font-size:12px;color:#6b6152;text-align:center;margin-bottom:14px;font-family:'Space Mono',monospace;}
  .qsentence{font-size:16px;line-height:1.6;text-align:center;color:var(--ink);margin:10px 0 16px;font-style:italic;}
  .qsentence b{font-style:normal;border-bottom:2px solid var(--ink);padding:0 4px;}

  .speak-row{display:flex;justify-content:center;margin-bottom:14px;}
  .speak-btn{
    border:none;background:var(--ink);color:var(--white);
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 3px 8px rgba(30,51,72,0.3);font-size:16px;
  }
  .speak-btn:active{transform:scale(0.92);}

  .options{display:flex;flex-direction:column;gap:9px;}
  .opt{
    background:var(--white);border:1.5px solid var(--kraft-dark);border-radius:6px;
    padding:11px 14px;font-size:14.5px;cursor:pointer;text-align:left;
    font-family:'Libre Franklin',sans-serif;color:var(--ink);
  }
  .opt:hover{border-color:var(--ink);}
  .opt.selected{border-color:var(--ink);background:#eee6d3;font-weight:600;}
  .opt.correct{border-color:var(--stamp-green);background:#e3ede4;font-weight:600;}
  .opt.incorrect{border-color:var(--stamp-red);background:#f3dfdb;font-weight:600;}

  .type-row{display:flex;gap:8px;margin-top:6px;}
  .type-input{
    flex:1;padding:11px 14px;border:1.5px solid var(--kraft-dark);border-radius:6px;
    font-family:'Libre Franklin',sans-serif;font-size:15px;background:var(--white);color:var(--ink);
  }
  .type-input:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .type-input.correct{border-color:var(--stamp-green);background:#e3ede4;}
  .type-input.incorrect{border-color:var(--stamp-red);background:#f3dfdb;}
  .type-feedback{margin-top:10px;font-size:13px;text-align:center;font-family:'Space Mono',monospace;}
  .type-feedback.correct{color:var(--stamp-green);}
  .type-feedback.incorrect{color:var(--stamp-red);}

  .controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
  button.ctl{
    font-family:'Space Mono',monospace;font-size:12px;background:var(--white);
    border:1px solid var(--kraft-dark);color:var(--ink);padding:9px 16px;border-radius:5px;
    cursor:pointer;letter-spacing:0.5px;
  }
  button.ctl:hover{border-color:var(--ink);}
  button.ctl.primary{background:var(--ink);color:var(--white);border-color:var(--ink);}
  button.ctl:disabled{opacity:0.4;cursor:not-allowed;}

  .result{
    max-width:420px;margin:10px auto 0;text-align:center;
    background:var(--white);border:1px solid var(--kraft-dark);border-radius:8px;
    padding:30px 24px;
  }
  .result .score{font-family:'Oswald',sans-serif;font-weight:700;font-size:44px;margin:6px 0;}
  .result .stamp{
    display:inline-block;font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:2px;text-transform:uppercase;border:2.5px solid;border-radius:4px;
    padding:5px 12px;transform:rotate(-6deg);margin-top:10px;
  }
  .stamp.pass{color:var(--stamp-green);border-color:var(--stamp-green);}
  .stamp.retry{color:var(--stamp-red);border-color:var(--stamp-red);}
  .part-breakdown{text-align:left;margin-top:22px;font-size:13px;}
  .part-breakdown .prow{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--kraft-dark);}
  .result-list{text-align:left;margin-top:20px;font-size:13px;}
  .result-list .ritem{padding:8px 0;border-top:1px solid var(--kraft-dark);}
  .ritem .rword{font-weight:700;}
  .ritem.wrong .rword{color:var(--stamp-red);}
  .ritem.right .rword{color:var(--stamp-green);}
  .hidden{display:none;}
  @media (prefers-reduced-motion: reduce){ .progress-fill{transition:none;} }
</style>
</head>

const PART_LABELS = ["Trắc nghiệm nghĩa", "Nghe & điền từ", "Viết từ", "Điền từ vào câu"];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function normalize(s){
  return (s||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[.,!?;:'"]/g,'');
}

function blankSentence(example, word){
  const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
  return example.replace(re, '______');
}

// pick 24 distinct words, split into 4 groups of 6
const shuffledPool = shuffle(FULL_POOL);
const chosen = shuffledPool.slice(0, 24);
const groups = [chosen.slice(0,6), chosen.slice(6,12), chosen.slice(12,18), chosen.slice(18,24)];

let questions = [];

// Part 1: mcq_meaning
groups[0].forEach(w => {
  const others = FULL_POOL.filter(p => p.word !== w.word);
  const distractors = shuffle(others).slice(0,3).map(p=>p.meaning);
  questions.push({
    part:0, type:'mcq_meaning', word:w.word, pos:w.pos, meaning:w.meaning,
    options: shuffle([w.meaning, ...distractors])
  });
});

// Part 2: listen_fill (type the missing word after listening)
groups[1].forEach(w => {
  questions.push({
    part:1, type:'listen_fill', word:w.word, pos:w.pos, example:w.example,
    exampleVi:w.exampleVi, blanked: blankSentence(w.example, w.word)
  });
});

// Part 3: write (Vietnamese meaning -> type English word)
groups[2].forEach(w => {
  questions.push({
    part:2, type:'write', word:w.word, pos:w.pos, meaning:w.meaning
  });
});

// Part 4: mcq_fill (sentence with blank, choose correct word)
groups[3].forEach(w => {
  const others = FULL_POOL.filter(p => p.word !== w.word);
  const distractors = shuffle(others).slice(0,3).map(p=>p.word);
  questions.push({
    part:3, type:'mcq_fill', word:w.word, pos:w.pos, example:w.example,
    blanked: blankSentence(w.example, w.word),
    options: shuffle([w.word, ...distractors])
  });
});

let current = 0;
let answers = new Array(questions.length).fill(null).map(() => ({done:false, userAnswer:null, isCorrect:false}));

const $ = id => document.getElementById(id);

function renderPartTabs(){
  const wrap = $('partTabs');
  wrap.innerHTML = '';
  const currentPart = questions[current].part;
  PART_LABELS.forEach((label, i) => {
    const partQuestionIdxs = questions.map((q,idx)=>({q,idx})).filter(o=>o.q.part===i).map(o=>o.idx);
    const partDone = partQuestionIdxs.every(idx => answers[idx].done);
    const tag = document.createElement('span');
    tag.className = 'parttag' + (i===currentPart ? ' active' : '') + (partDone ? ' done':'');
    tag.textContent = `${i+1}. ${label}`;
    wrap.appendChild(tag);
  });
}

function renderQuestion(){
  const q = questions[current];
  const a = answers[current];
  $('qnum').textContent = 'Q-' + String(current+1).padStart(2,'0');
  $('qtype').textContent = PART_LABELS[q.part];
  $('progressLabel').textContent = `Câu ${current+1} / ${questions.length}`;
  $('progressFill').style.width = (current/questions.length*100) + '%';
  renderPartTabs();

  const body = $('qbody');
  body.innerHTML = '';

  if(q.type === 'mcq_meaning'){
    const w = document.createElement('div'); w.className='qword'; w.textContent = q.word;
    const p = document.createElement('div'); p.className='qpos'; p.textContent = q.pos;
    const h = document.createElement('div'); h.className='qhint'; h.textContent = 'Từ này có nghĩa là gì?';
    body.appendChild(w); body.appendChild(p); body.appendChild(h);
    const optWrap = document.createElement('div'); optWrap.className='options';
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className='opt'; btn.type='button'; btn.textContent = opt;
      if(a.done){
        btn.disabled = true;
        if(opt === q.meaning) btn.classList.add('correct');
        else if(opt === a.userAnswer) btn.classList.add('incorrect');
      } else if(a.userAnswer === opt){
        btn.classList.add('selected');
      }
      btn.addEventListener('click', () => {
        if(a.done) return;
        a.userAnswer = opt;
        a.isCorrect = (opt === q.meaning);
        a.done = true;
        renderQuestion();
      });
      optWrap.appendChild(btn);
    });
    body.appendChild(optWrap);
  }

  else if(q.type === 'listen_fill'){
    const p = document.createElement('div'); p.className='qpos'; p.textContent = q.pos;
    const h = document.createElement('div'); h.className='qhint'; h.textContent = 'Nghe câu, rồi gõ từ còn thiếu';
    const speakRow = document.createElement('div'); speakRow.className='speak-row';
    const speakBtn = document.createElement('button'); speakBtn.className='speak-btn'; speakBtn.type='button'; speakBtn.textContent='▶';
    speakBtn.addEventListener('click', () => speak(q.example));
    speakRow.appendChild(speakBtn);
    const sent = document.createElement('div'); sent.className='qsentence';
    sent.innerHTML = q.blanked.replace('______', '<b>______</b>');
    body.appendChild(p); body.appendChild(h); body.appendChild(speakRow); body.appendChild(sent);

    const row = document.createElement('div'); row.className='type-row';
    const input = document.createElement('input');
    input.type='text'; input.className='type-input'; input.placeholder='Gõ từ bạn nghe được...';
    input.value = a.userAnswer || '';
    if(a.done){
      input.disabled = true;
      input.classList.add(a.isCorrect ? 'correct' : 'incorrect');
    }
    row.appendChild(input);
    if(!a.done){
      const checkBtn = document.createElement('button');
      checkBtn.className='ctl primary'; checkBtn.type='button'; checkBtn.textContent='Kiểm tra';
      checkBtn.addEventListener('click', () => {
        a.userAnswer = input.value;
        a.isCorrect = normalize(input.value) === normalize(q.word);
        a.done = true;
        renderQuestion();
      });
      row.appendChild(checkBtn);
      input.addEventListener('keydown', e => { if(e.key==='Enter') checkBtn.click(); });
    }
    body.appendChild(row);
    if(a.done){
      const fb = document.createElement('div');
      fb.className = 'type-feedback ' + (a.isCorrect ? 'correct':'incorrect');
      fb.textContent = a.isCorrect ? 'Chính xác!' : `Đáp án đúng: ${q.word}`;
      body.appendChild(fb);
    }
    setTimeout(() => { if(!a.done) input.focus(); }, 50);
  }

  else if(q.type === 'write'){
    const h = document.createElement('div'); h.className='qhint'; h.textContent = 'Từ tiếng Anh nào có nghĩa là:';
    const m = document.createElement('div'); m.className='qword'; m.style.fontSize='24px'; m.textContent = q.meaning;
    body.appendChild(h); body.appendChild(m);

    const row = document.createElement('div'); row.className='type-row'; row.style.marginTop='16px';
    const input = document.createElement('input');
    input.type='text'; input.className='type-input'; input.placeholder='Gõ từ tiếng Anh...';
    input.value = a.userAnswer || '';
    if(a.done){
      input.disabled = true;
      input.classList.add(a.isCorrect ? 'correct' : 'incorrect');
    }
    row.appendChild(input);
    if(!a.done){
      const checkBtn = document.createElement('button');
      checkBtn.className='ctl primary'; checkBtn.type='button'; checkBtn.textContent='Kiểm tra';
      checkBtn.addEventListener('click', () => {
        a.userAnswer = input.value;
        a.isCorrect = normalize(input.value) === normalize(q.word);
        a.done = true;
        renderQuestion();
      });
      row.appendChild(checkBtn);
      input.addEventListener('keydown', e => { if(e.key==='Enter') checkBtn.click(); });
    }
    body.appendChild(row);
    if(a.done){
      const fb = document.createElement('div');
      fb.className = 'type-feedback ' + (a.isCorrect ? 'correct':'incorrect');
      fb.textContent = a.isCorrect ? 'Chính xác!' : `Đáp án đúng: ${q.word}`;
      body.appendChild(fb);
    }
    setTimeout(() => { if(!a.done) input.focus(); }, 50);
  }

  else if(q.type === 'mcq_fill'){
    const h = document.createElement('div'); h.className='qhint'; h.textContent = 'Chọn từ đúng để điền vào chỗ trống';
    const sent = document.createElement('div'); sent.className='qsentence';
    sent.innerHTML = q.blanked.replace('______', '<b>______</b>');
    body.appendChild(h); body.appendChild(sent);

    const optWrap = document.createElement('div'); optWrap.className='options';
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className='opt'; btn.type='button'; btn.textContent = opt;
      if(a.done){
        btn.disabled = true;
        if(opt === q.word) btn.classList.add('correct');
        else if(opt === a.userAnswer) btn.classList.add('incorrect');
      } else if(a.userAnswer === opt){
        btn.classList.add('selected');
      }
      btn.addEventListener('click', () => {
        if(a.done) return;
        a.userAnswer = opt;
        a.isCorrect = (opt === q.word);
        a.done = true;
        renderQuestion();
      });
      optWrap.appendChild(btn);
    });
    body.appendChild(optWrap);
  }

  $('prevBtn').disabled = current === 0;
  $('nextBtn').disabled = !a.done;
  $('nextBtn').textContent = current === questions.length - 1 ? 'Nộp bài ✓' : 'Câu tiếp ▶';
}

let englishVoice = null;
function pickEnglishVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  englishVoice = voices.find(v=>v.lang==='en-US')
    || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('en'))
    || null;
}
if('speechSynthesis' in window){
  pickEnglishVoice();
  window.speechSynthesis.onvoiceschanged = pickEnglishVoice;
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  if(!englishVoice) pickEnglishVoice();
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if(englishVoice) u.voice = englishVoice;
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

$('prevBtn').addEventListener('click', () => {
  if(current > 0){ current--; renderQuestion(); }
});
$('nextBtn').addEventListener('click', () => {
  if(!answers[current].done) return;
  if(current < questions.length - 1){
    current++;
    renderQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  let score = 0;
  const partScores = [0,0,0,0];
  const partTotals = [0,0,0,0];
  const listEl = $('resultList');
  listEl.innerHTML = '';
  questions.forEach((q, i) => {
    const a = answers[i];
    partTotals[q.part]++;
    if(a.isCorrect){ score++; partScores[q.part]++; }
    const row = document.createElement('div');
    row.className = 'ritem ' + (a.isCorrect ? 'right' : 'wrong');
    const correctAns = q.type === 'mcq_meaning' ? q.meaning : q.word;
    row.innerHTML = `<span class="rword">${q.word}</span> (${PART_LABELS[q.part]}) — đúng: ${correctAns}` +
      (a.isCorrect ? '' : ` <br>(bạn trả lời: ${a.userAnswer || '—'})`);
    listEl.appendChild(row);
  });

  $('quizArea').classList.add('hidden');
  $('resultArea').classList.remove('hidden');
  $('scoreText').textContent = `${score} / ${questions.length}`;

  const bd = $('partBreakdown');
  bd.innerHTML = '';
  PART_LABELS.forEach((label, i) => {
    const row = document.createElement('div'); row.className='prow';
    row.innerHTML = `<span>${label}</span><span>${partScores[i]} / ${partTotals[i]}</span>`;
    bd.appendChild(row);
  });

  const pct = score / questions.length;
  const stampEl = $('stampArea');
  stampEl.innerHTML = pct >= 0.7
    ? '<div class="stamp pass">Đạt</div>'
    : '<div class="stamp retry">Cần ôn thêm</div>';
}

$('retryBtn').addEventListener('click', () => {
  window.location.reload();
});

renderQuestion();
</script>
</body>
</html>
